# /etc/nginx/sites-available/clockfy
# Proxy reverso do Clockfy. Troque clockfy.exemplo.com.br pelo seu domínio.
# O HTTPS é adicionado automaticamente pelo certbot (certbot --nginx -d clockfy.exemplo.com.br).
server {
    listen 80;
    listen [::]:80;
    server_name clockfy.exemplo.com.br;

    client_max_body_size 25m;          # recibos e imagens (MAX_UPLOAD_BYTES)
    proxy_read_timeout 300s;           # relatórios grandes e importação

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
